<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บทพิธีกร (MC Script) งานเลี้ยงแสดงมุทิตาจิต สสจ.สมุทรปราการ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f0fa;--ink:#2a2340;--card:#fff;--mut:#6b6488;--a:#e8467c;--b:#0e93a0;--line:#e3dcf2;--nm:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--ink:#efeaff;--card:#221e2e;--mut:#a9a2c4;--line:#37304a;--nm:#fff}}
:root[data-theme="dark"]{--nm:#fff;--bg:#17141f;--ink:#efeaff;--card:#221e2e;--mut:#a9a2c4;--line:#37304a}
*,*:before,*:after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,'TH Sarabun New','Noto Sans Thai',sans-serif;font-size:calc(17px*var(--z,1));line-height:1.65}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.bar button{touch-action:manipulation;font:600 15px Sarabun,sans-serif;padding:7px 14px;border:0;border-radius:999px;background:var(--ink);color:var(--card);cursor:pointer}
.bar button.on{background:var(--a);color:#fff}
.bar .pr{background:var(--b);color:#fff}
#st{font-size:14px;color:var(--mut)}
.paper{max-width:210mm;margin:16px auto;padding:10mm;background:var(--card);border-radius:14px;box-shadow:0 4px 24px rgba(60,30,120,.12)}
.top{height:10px;border-radius:6px;background:linear-gradient(90deg,#e8467c,#f28c28,#f2c200,#3aa856,#0e93a0,#4a6cf7,#8a4fd8)}
h1{margin:14px 0 2px;font-size:1.55em;line-height:1.3;text-align:center;font-weight:700;background:linear-gradient(90deg,#e8467c,#8a4fd8,#0e93a0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sub{text-align:center;color:var(--mut);font-size:.92em;margin-bottom:8px}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 14px;font-size:.9em}
.chip{padding:2px 14px;border-radius:999px;color:#fff;font-weight:600}
.seg{margin:0 0 14px;border:1.5px solid var(--c);border-radius:12px;overflow:hidden;break-inside:avoid-page}
.sh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;background:var(--c);color:#fff;font-weight:700}
.tm{background:rgba(255,255,255,.25);border-radius:999px;padding:0 10px;font-size:.88em;white-space:nowrap}
.cue{padding:4px 12px;font-size:.85em;color:var(--mut);border-bottom:1px dashed var(--line)}
.cue:empty{display:none}
.ln{display:flex;gap:10px;padding:6px 12px;break-inside:avoid}
.who{flex:0 0 3.2em;text-align:center;align-self:flex-start;border-radius:8px;color:#fff;font-weight:700;font-size:.9em;line-height:1.7;margin-top:3px;user-select:none}
.w0{background:var(--a)}.w1{background:var(--b)}
.tx{flex:1;min-width:0;white-space:pre-line}
.dir .who{display:none}
.dir .tx{font-style:italic;color:var(--mut);font-size:.9em;text-align:center}
.nm{font-weight:700;color:var(--nm);text-decoration:underline;text-decoration-color:var(--a);text-decoration-thickness:2px;text-underline-offset:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ctl{display:none}
.edit .ctl{display:inline-block}
.edit .who{cursor:pointer;outline:2px dashed rgba(0,0,0,.25)}
.edit [contenteditable]{outline:1px dotted var(--mut);border-radius:4px}
.ctl button{font:600 13px Sarabun,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:1px 9px;cursor:pointer;margin:4px 0 4px 6px}
.ft{text-align:center;color:var(--mut);font-size:.85em;margin-top:6px}
@media(max-width:840px){.paper{margin:12px}}
@media(min-width:641px) and (max-width:1024px){body{font-size:calc(18px*var(--z,1))}.ctl button{padding:6px 14px;font-size:14px}}
@media(max-width:640px){
.bar{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:8px 10px;-webkit-overflow-scrolling:touch}
.bar button{flex:0 0 auto;white-space:nowrap;padding:9px 14px}
#st{flex:0 0 auto;white-space:nowrap}
.paper{margin:0;padding:12px 12px 28px;border-radius:0;box-shadow:none}
h1{font-size:1.25em}
.lg{font-size:.82em}
.sh{padding:6px 10px}
.ln{padding:6px 8px;gap:8px}
.who{flex-basis:2.8em;font-size:.82em}
.ctl button{padding:8px 14px;font-size:14px}
}
@media print{
@page{size:A4;margin:12mm}
:root{--nm:#000;--bg:#fff;--ink:#2a2340;--card:#fff;--mut:#6b6488;--line:#e3dcf2}
body{background:#fff;font-size:16pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar,.ctl{display:none!important}
.paper{margin:0;padding:0;box-shadow:none;border-radius:0;max-width:none}
.seg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sh,.who,.chip,.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
<button id="be">แก้ไข</button>
<button id="bz1" aria-label="ลดขนาดตัวอักษร">A−</button>
<button id="bz2" aria-label="เพิ่มขนาดตัวอักษร">A+</button>
<button id="bs">บันทึกในเครื่อง</button>
<button id="bd">ดาวน์โหลด HTML</button>
<button id="bp" class="pr">พิมพ์ / บันทึก PDF (A4)</button>
<button id="br">คืนค่าเดิม</button>
<span id="st"></span>
</div>
<div class="paper">
<div class="top"></div>
<div id="app"></div>
</div>
<script id="d" type="application/json">
{"title": "บทพิธีกร (MC Script) งานเลี้ยงแสดงมุทิตาจิตแด่พี่ ๆ ผู้เกษียณอายุราชการ สำนักงานสาธารณสุขจังหวัดสมุทรปราการ ประจำปี 2569", "sub": "ธีมงาน : “สีสัน คัลเลอร์ฟูล”", "names": ["ใหม่ (ส่งเสริม)", "ยู (แผนไทย)"], "segs": [{"t": "18.00 – 19.00 น.", "h": "ลงทะเบียนและเตรียมความพร้อม", "n": "", "l": [[0, "สวัสดีค่าาาา!"], [1, "สวัสดีครับ พี่ ๆ น้อง ๆ ครอบครัวสาธารณสุขสมุทรปราการทุกคนครับ ยินดีต้อนรับเข้าสู่งานในค่ำคืนนี้นะครับ สำหรับธีมงานของเราคืนนี้คือ “สีสัน คัลเลอร์ฟูล” ครับ เพราะตลอดเส้นทางการทำงานของพี่ ๆ ผู้เกษียณของเรา ล้วนเต็มไปด้วยความหมายที่หลากหลายสีสัน ทั้งความสนุก ความซาบซึ้ง ความประทับใจ ซึ่งในค่ำคืนนี้...เราจะมาร่วมกันเติมเต็มสีสันและความทรงจำดี ๆ ไปด้วยกันครับ"], [0, "จริงค่ะ และคืนนี้ก็ไม่ได้มีแค่สีสันของเสื้อผ้าเท่านั้นนะคะ แต่ยังมีสีสันของรอยยิ้ม สีสันของเสียงหัวเราะ และสีสันของความทรงจำดี ๆ ที่เราจะมาร่วมกันสร้างขึ้นในค่ำคืนนี้ด้วยกัน"], [1, "ใช่เลยครับ เพราะคืนนี้เราไม่ได้มาร่วมงานเกษียณอายุราชการกันแบบเป็นทางการเพียงอย่างเดียว แต่วันนี้เรามาในฐานะของครอบครัวสาธารณสุขสมุทรปราการ ที่จะมาร่วมกันส่งต่อความรัก ความผูกพัน และความประทับใจให้กับพี่ ๆ ผู้เกษียณของเรา"], [0, "เพราะฉะนั้น คืนนี้ขอให้ทุกคน... ยิ้มเยอะ ๆ สนุกกันให้เต็มที่ และที่สำคัญ เก็บความทรงจำดี ๆ ในค่ำคืนนี้กลับบ้านไปด้วยกันนะคะ"], [1, "เอาล่ะครับ ไหน ๆ ก็ขึ้นธีมงาน “สีสัน คัลเลอร์ฟูล” แล้ว เรามาดูกันสักหน่อยนะครับว่า จะมีกลุ่มงานไหนจัดเต็มกันบ้าง...ขอเสียงกลุ่มงาน 1... 2... 3... ไปเรื่อย ๆ เลยครับ!"], [0, "โอ้โห! คืนนี้สีสันสดใสกันทั้งห้องเลยนะครับ ต่างก็ตั้งใจใส่มาให้พี่ ๆ ผู้เกษียณได้คึกคัก ครื้นเครง และประทับใจกันเลยทีเดียว\nสำหรับพี่ ๆ น้อง ๆ คนไหนที่ลงทะเบียนแล้ว นั่งประจำที่นั่งฟังเพลงเพราะ ๆ จากนักร้องดาวเด่นประจำสำนักงานสาธารณสุขจังหวัดสมุทรปราการของเรา มาร่วมสร้างสีสันให้กับค่ำคืนนี้ด้วยนะคะ ไม่ว่าจะเป็น พี่ปู พี่ต้อง พี่วาส พี่หลาด และพี่ ๆ ท่านใดที่อยากขึ้นมาร่วมร้องเพลงกับเรา สามารถขอเพลงและขึ้นมาร่วมสนุกกันได้เลยครับ"], [1, "คืนนี้เวทีของเราเปิดกว้างสำหรับทุกคนครับ ใครมีเพลงในใจ ใครมีเพลงที่อยากมอบให้พี่ ๆ ผู้เกษียณ หรือใครอยากมาร่วมสร้างสีสันให้กับค่ำคืนนี้ เชิญได้เลยครับ"], [2, "(Cue: เปิดดนตรี / นักร้องเริ่มการแสดง / รับประทานอาหาร)"], [1, "สำหรับผังที่นั่งสามารถดูได้ที่จุดลงทะเบียน หรือดูป้ายชื่อกลุ่มงานที่โต๊ะได้เลยนะครับ ถ้าหาไม่เจอ สอบถามทีมต้อนรับของเราได้ทุกจุดเลยครับ"], [0, "ระหว่างนี้ขอให้ทุกท่านพักผ่อนตามอัธยาศัย แวะทักทาย และไปถ่ายรูป เก็บความประทับใจกันตามสบาย อีกสักครู่นะค่ะ แล้วเดี๋ยวกลับมาพบกันในช่วงพิธีการค่ะ ในเวลา 19.00 น.\nขอให้ทุกท่านมีความสุขกับค่ำคืนแห่งสีสันและความทรงจำดี ๆ ไปด้วยกันนะคะ"], [2, "(19.00 น. ประธานในพิธีเดินทางมาถึงงาน — ทีมต้อนรับส่งสัญญาณ → พิธีกรเตรียมกล่าวต้อนรับและเปิดงาน)"]]}, {"t": "19.00 น.", "h": "กล่าวต้อนรับและเปิดงาน", "n": "", "l": [[2, "(ดนตรีบรรเลงคลอเบา ๆ เพื่อสร้างบรรยากาศ)"], [1, "เรียนท่าน นายแพทย์ประภาส ผูกดวง นายแพทย์สาธารณสุขจังหวัดสมุทรปราการ คณะผู้บริหาร แขกผู้มีเกียรติ และพี่น้องชาวสาธารณสุขสมุทรปราการทุกท่านอย่างเป็นทางการอีกครั้งครับ\nผม ศรัณยู โสตะวงศ์ (น้องยู) แพทย์แผนไทยชำนาญการ จากกลุ่มงานการแพทย์แผนไทยและการแพทย์ทางเลือกครับ"], [0, "และดิฉัน จิตราวรรณ ฉันทจิตปรีชา (น้องใหม่) นักวิชาการสาธารณสุขชำนาญการ จากกลุ่มงานส่งเสริมสุขภาพค่ะ เราสองคนขอต้อนรับทุกคนเข้าสู่งานเลี้ยงแสดงมุทิตาจิตแด่พี่ ๆ ผู้เกษียณอายุราชการ สำนักงานสาธารณสุขจังหวัดสมุทรปราการ ประจำปี 2569 ค่ะ"], [1, "คืนนี้พวกเราทุกคนตั้งใจจัดขึ้นเพื่อแสดงมุทิตาจิตและแทนคำขอบคุณแด่พี่ ๆ ผู้เกษียณที่น่ารักของเรา ที่ทุ่มเทแรงกาย แรงใจ ทำงานด้วยความรักและเสียสละมาตลอดหลายสิบปีครับ ภายใต้ธีมงาน “สีสัน คัลเลอร์ฟูล” ที่สะท้อนถึงความทรงจำอันหลากสีสัน ตลอดเส้นทางที่พวกเราทำงานร่วมกันมาครับ"], [0, "ซึ่งในปีนี้ครอบครัวสาธารณสุขสมุทรปราการของเรา มีพี่ ๆ ที่ครบวาระเกษียณอายุราชการ และกำลังจะก้าวสู่วัยเกษียณสำราญ จำนวน 5 ท่านด้วยกัน และเพื่อเป็นการย้อนรอยความทรงจำและเกียรติประวัติของพี่ ๆ ทั้ง 5 ท่าน ขอเชิญทุกท่านรับชมเรื่องราวความประทับใจ ผ่านวีดิทัศน์ชุดนี้ ที่พวกเราตั้งใจทำมาให้ชมไปพร้อม ๆ กันเลยค่ะ"], [2, "(ทีมงาน กง.IT และ บริหาร เปิดวีดิทัศน์ผู้เกษียณอายุ)\n(Cue: จบบทพูด → ทีมงาน กง.IT และ บริหาร เปิดวีดิทัศน์ผู้เกษียณอายุราชการ)"], [2, "(หลังจบวีดิทัศน์ผู้เกษียณ)\nCue: วีดิทัศน์จบ → ดนตรีบรรเลงคลอเบา ๆ"], [1, "เป็นอย่างไรกันบ้างครับ สำหรับวีดิทัศน์ที่พวกเราตั้งใจจัดทำขึ้นเพื่อพี่ ๆ ผู้เกษียณทั้ง 5 ท่าน เชื่อว่าภาพและเรื่องราวที่เราได้ชมกันเมื่อสักครู่นี้ คงทำให้หลาย ๆ ท่านได้ย้อนกลับไปนึกถึงเรื่องราว ความทรงจำ และช่วงเวลาต่าง ๆ ที่ได้ร่วมงานกันมานะครับ"], [0, "ใช่ค่ะ เพราะตลอดเส้นทางการทำงานที่ผ่านมา แต่ละท่านได้สร้างทั้งผลงาน ความทรงจำ และความผูกพันไว้กับครอบครัวสาธารณสุขสมุทรปราการของเราอย่างมากมายค่ะ และในค่ำคืนนี้....เราจะมาร่วมกันส่งต่อความรัก ความปรารถนาดี และคำขอบคุณให้กับพี่ ๆ ผู้เกษียณของเราค่ะ"]]}, {"t": "19.10 น.", "h": "เปิดตัวผู้เกษียณอายุราชการ", "n": "", "l": [[1, "จบลงไปแล้วนะครับสำหรับภาพความทรงจำที่แสนประทับใจ ลำดับต่อไป ขอเสียงปรบมือดัง ๆ ต้อนรับพี่ ๆ ผู้เกษียณอายุราชการทั้ง 5 ท่าน ขึ้นสู่เวทีเกียรติยศแห่งนี้ครับ\nท่านแรก นางจิราภรณ์ พรหมอินทร์ (พี่จิ) นักวิชาการสาธารณสุขเชี่ยวชาญ (ด้านส่งเสริมพัฒนา) รองนายแพทย์สาธารณสุขจังหวัดสมุทรปราการ\nท่านที่ 2 นายคำรณ มั่งมี (พี่แฟรงค์) นักวิชาการสาธารณสุขชำนาญการพิเศษ รองนายแพทย์สาธารณสุขจังหวัดสมุทรปราการ"], [0, "ท่านที่ 3 นางอัจฉรา ส่งเสริม (พี่แอร์) เภสัชกรชำนาญการพิเศษ กลุ่มงานคุ้มครองผู้บริโภคและเภสัชสาธารณสุข\nท่านที่ 4 นางสาวมาลี เที่ยงท้องคุ้ง (พี่ป้อม มาลี) เจ้าพนักงานธุรการอาวุโส กลุ่มงานบริหารทั่วไป\nและท่านที่ 5 นางเมตตา สุขแก้ว (พี่หมู) นักวิชาการสาธารณสุขชำนาญการ กลุ่มกฎหมาย ค่ะ"]]}, {"t": "19.30 น.", "h": "ประธานกล่าวเปิดงาน และกล่าวแสดงมุทิตาจิต", "n": "", "l": [[1, "ในโอกาสอันดีนี้ ผมขอเรียนเชิญ นายแพทย์ประภาส ผูกดวง นายแพทย์สาธารณสุขจังหวัดสมุทรปราการ ให้เกียรติขึ้นกล่าวเปิดงาน และกล่าวแสดงมุทิตาจิตแด่พี่ ๆ ผู้เกษียณอายุราชการทั้ง 5 ท่าน ขอเรียนเชิญครับ"], [2, "(นพ.สสจ. แสดงมุทิตาจิตและกล่าวเปิดงาน)\nCue: ประธานขึ้นเวที / ดนตรีเปิดตัวเบา ๆ → ประธานกล่าว"], [0, "ขอขอบพระคุณท่านนายแพทย์สาธารณสุขจังหวัดสมุทรปราการเป็นอย่างสูงค่ะ"], [2, "(ดนตรีบรรเลงคลอเบา ๆ เพื่อสร้างบรรยากาศ)"]]}, {"t": "19.35 น.", "h": "แขก VIP กล่าวมุทิตาจิต", "n": "", "l": [[1, "อย่างที่บอกว่าในค่ำคืนนี้เป็นค่ำคืนสุดพิเศษ เรายังได้รับเกียรติจากอดีตผู้บริหารและรุ่นพี่ผู้เกษียณ แขกสุดพิเศษมาร่วมงานนี้ ที่จะมากล่าวมุทิตาจิตแสดงความยินดี และต้อนรับพี่ ๆ สู่วัยเกษียณสำราญ และมอบข้อคิดดี ๆ ให้กับพวกเราชาวสาธารณสุขสมุทรปราการครับ"], [0, "ขอเรียนเชิญ นายแพทย์ณรงค์ สหเมธาพัฒน์ อดีตปลัดกระทรวงสาธารณสุข และอดีตนายแพทย์สาธารณสุขจังหวัดสมุทรปราการ\nและขอเรียนเชิญ นายแพทย์สวัสดิ์ อภิวัจนีวงค์ อดีตผู้ตรวจราชการกระทรวงสาธารณสุข\nขอเรียนเชิญค่ะ"], [2, "(แขก VIP กล่าวต้อนรับและมอบข้อคิด)"]]}, {"t": "19.45 น.", "h": "มอบช่อดอกไม้ และถ่ายภาพ", "n": "", "l": [[1, "ขอขอบพระคุณ ท่านนายแพทย์ณรงค์ สหเมธาพัฒน์ และ ท่านนายแพทย์สวัสดิ์ อภิวัจนีวงค์ เป็นอย่างสูงครับ ขอเสียงปรบมือดัง ๆ ให้กับทั้งสองท่านด้วยครับ"], [0, "ลำดับต่อไป ขอเรียนเชิญ ท่านนายแพทย์ประภาส ผูกดวง ให้เกียรติมอบช่อดอกไม้และของที่ระลึก เพื่อเป็นการแสดงความขอบคุณแด่พี่ ๆ ผู้เกษียณอายุราชการทั้ง 5 ท่าน ขอเรียนเชิญค่ะ"], [2, "(นพ.สสจ. มอบช่อดอกไม้และของที่ระลึกทีละท่าน - ทีมงานปฐมภูมิเตรียมดอกไม้)"], [0, "และเพื่อเป็นการบันทึกภาพแห่งความทรงจำร่วมกัน ขอเรียนเชิญท่านประธาน แขก VIP และผู้เกษียณอายุราชการอยู่บนเวทีก่อนนะคะ\nชุดที่ 1: นายแพทย์สาธารณสุขจังหวัดสมุทรปราการ และผู้เกษียณอายุราชการทั้ง 5 ท่านค่ะ"], [1, "ชุดที่ 2: ขอเรียนเชิญ ท่านรองนายแพทย์สาธารณสุขจังหวัด และท่านผู้ช่วยนายแพทย์สาธารณสุขจังหวัด ขึ้นถ่ายภาพร่วมกันบนเวทีครับ"], [0, "ชุดที่ 3: ขอเรียนเชิญ ท่านหัวหน้ากลุ่มงาน สำนักงานสาธารณสุขจังหวัดสมุทรปราการทุกท่าน ร่วมถ่ายภาพที่ด้านหน้าเวทีค่ะ"]]}, {"t": "20.00 น.", "h": "ผู้เกษียณอายุราชการกล่าวแสดงความรู้สึก", "n": "", "l": [[1, "ขอขอบพระคุณทุกท่านครับ ลำดับต่อไป เราจะมาฟังความรู้สึก ความผูกพัน และความประทับใจจากพี่ ๆ ผู้เกษียณอายุราชการทั้ง 5 ท่านกันครับ"], [0, "ขอเชิญพี่ ๆ ทั้ง 5 ท่านร่วมแบ่งปันความรู้สึก ความประทับใจ หรือเรื่องราวดี ๆ ที่อยากฝากถึงน้อง ๆ ทุกคนในค่ำคืนนี้ค่ะ"], [2, "(Cue: ผู้เกษียณกล่าวความรู้สึกทีละท่าน)"], [0, "ขอเรียนเชิญท่านแรกค่ะ ท่านรองฯ จิราภรณ์ พรหมอินทร์ กล่าวความรู้สึกกับน้อง ๆ และครอบครัวสาธารณสุขสมุทรปราการค่ะ ตามด้วยพี่แฟรงค์, พี่แอร์, พี่ป้อม มาลี และพี่หมู ตามลำดับครับ"], [2, "(ผู้เกษียณกล่าวความรู้สึก ท่านละประมาณ 5 นาที)"], [1, "ขอบคุณพี่ ๆ ทุกท่านมากครับ สำหรับเรื่องราวและความรู้สึกดี ๆ ที่นำมาแบ่งปันให้พวกเราได <script>
const $=s=>document.querySelector(s),KEY='mc-script-mutita-v2',PAL=['#e8467c','#f28c28','#d9a400','#3aa856','#0e93a0','#4a6cf7','#8a4fd8'];
const D=JSON.parse($('#d').textContent);let data=D,edit=false;
try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
function h(tag,cls,txt,ed){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(ed&&edit)e.contentEditable='true';return e}
const RE=/((?:(?:นางสาว|นาง|นายแพทย์|นาย)\s?)?(?:จิราภรณ์ พรหมอินทร์|คำรณ มั่งมี|อัจฉรา ส่งเสริม|มาลี เที่ยงท้องคุ้ง|เมตตา สุขแก้ว|ประภาส ผูกดวง|ณรงค์ สหเมธาพัฒน์|สวัสดิ์ อภิวัจนีวงค์|พี่จิ|พี่แฟรงค์|พี่แอร์|พี่ป้อม มาลี|พี่ป้อม|พี่หมู|ศรัณยู โสตะวงศ์|จิตราวรรณ ฉันทจิตปรีชา|ยู ศรัณยู|(?<=ดิฉัน )ใหม่))/g;
function hl(e){const p=e.textContent.split(RE);e.textContent='';p.forEach((t,i)=>{if(!t)return;if(i%2){const b=document.createElement('b');b.className='nm';b.textContent=t;e.append(b)}else e.append(t)})}

const sh=h('div','sh');sh.append(h('span','tm',g.t,1),h('span','hd',g.h,1));

function collect(){if(!document.querySelector('.seg'))return data;
const q=(e,s)=>e.querySelector(s).innerText.trim();
return{title:q(document,'#ttl'),sub:q(document,'#sub'),names:[...document.querySelectorAll('.lg .chip')].map(c=>c.innerText.replace('พิธีกร:','').trim()),
segs:[...document.querySelectorAll('.seg')].map(g=>({t:q(g,'.tm'),h:q(g,'.hd'),n:q(g,'.cue'),l:[...g.querySelectorAll('.ln')].map(r=>[+r.dataset.w,q(r,'.tx')])}))}}
function st(m){$('#st').textContent=m;setTimeout(()=>{$('#st').textContent=''},4000)}
function save(){data=collect();try{localStorage.setItem(KEY,JSON.stringify(data));st('บันทึกในเครื่องแล้ว')}catch(e){st('บันทึกในเครื่องไม่ได้ ให้ใช้ดาวน์โหลด HTML แทน')}}
async function dl(){data=collect();
const c=document.documentElement.cloneNode(true);c.querySelector('#d').textContent=JSON.stringify(data).replace(/</g,'\\u003c');
c.querySelector('#app').innerHTML='';c.querySelector('body').className='';
const html='<!DOCTYPE html>\n'+c.outerHTML,name='สคริปต์พิธีกร-มุทิตาจิต.html';
try{const d=window.claude?await claude.use('downloads'):null;
if(d){await d.save({filename:name,data:html});st('ดาวน์โหลดแล้ว')}
else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;a.click();st('ดาวน์โหลดแล้ว')}}
catch(e){st(e&&e.code==='declined'?'ยกเลิกการดาวน์โหลด':'ดาวน์โหลดไม่สำเร็จ')}}
document.addEventListener('click',e=>{
const a=e.target.closest('[data-a]');if(!a||!edit)return;
data=collect();const gi=+a.closest('.seg')?.dataset.i,li=+a.closest('.ln')?.dataset.i;
switch(a.dataset.a){
case 'flip':data.segs[gi].l[li][0]^=1;break;
case 'adr':data.segs[gi].l.push([2,'(หมายเหตุเวที)']);break;
case 'dln':data.segs[gi].l.splice(li,1);break;
case 'aln':data.segs[gi].l.push([data.segs[gi].l.length%2?1:0,'พิมพ์บทพูดที่นี่']);break;
case 'dseg':if(!confirm('ลบช่วงนี้ทั้งช่วง?'))return;data.segs.splice(gi,1);break;
case 'aseg':data.segs.push({t:'00.00 น.',h:'ช่วงใหม่',n:'',l:[[0,'พิมพ์บทพูดที่นี่']]});break}
render()});
$('#be').onclick=()=>{data=collect();edit=!edit;render()};

setZ(z);$('#bz1').onclick=()=>setZ(z-.1);$('#bz2').onclick=()=>setZ(z+.1);
